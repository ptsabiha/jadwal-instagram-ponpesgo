name: Insight Instagram

# Mengambil angka performa postingan & akun ke konten/data/performa.json (lihat alat/insight.mjs).
# Cron GitHub sering telat, tapi untuk insight itu tidak masalah: snapshot 24 jam / 48 jam / 7 hari
# mencatat umur sebenarnya saat diambil.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insight-instagram
  cancel-in-progress: false

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Insight
        run: node alat/insight.mjs
        env:
          KUNCI_PRIVAT: ${{ secrets.KUNCI_PRIVAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Kabari pemilik kalau gagal
        if: failure()
        run: node alat/telegram.mjs "⚠️ Pengambilan insight Instagram gagal. Lihat ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          KUNCI_PRIVAT: ${{ secrets.KUNCI_PRIVAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
