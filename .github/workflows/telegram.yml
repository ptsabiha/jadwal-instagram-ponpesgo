name: Laporan Telegram

# Mengirim laporan yang ditulis routine Claude (konten/data/kirim/*.txt) ke Telegram pemilik
# lewat @ponpesgoBot (lihat alat/telegram.mjs). Jalan begitu laporan di-push; cron hanya cadangan.
# Jalankan manual (Run workflow) untuk mengirim pesan uji.
on:
  push:
    branches: [main]
    paths: ['konten/data/kirim/*.txt']
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laporan-telegram
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pesan uji
        if: github.event_name == 'workflow_dispatch'
        run: node alat/telegram.mjs --uji
        env:
          KUNCI_PRIVAT: ${{ secrets.KUNCI_PRIVAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Kotak keluar
        run: node alat/telegram.mjs --kotak-keluar
        env:
          KUNCI_PRIVAT: ${{ secrets.KUNCI_PRIVAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
